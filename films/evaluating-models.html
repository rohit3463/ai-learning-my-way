<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Honest Scores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --void: #05070d;
    --ink: #0b1120;
    --bone: #eee6d6;
    --dim: #8d93a6;
    --amber: #f4b860;
    --rose: #ef8193;
    --star: #a9d6f5;
    --lilac: #c4b3ff;
    --hair: rgba(238, 230, 214, .16);
    --bar: 24px;
    --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; }
  [hidden] { display: none !important; }
  body {
    background: var(--void);
    color: var(--bone);
    font: 15px/1.45 var(--sans);
    overflow: hidden;
  }
  .theatre { height: 100%; display: flex; flex-direction: column; }

  .stage {
    position: relative;
    flex: 1;
    min-height: 420px;
    overflow: hidden;
    background: var(--ink);
    display: grid;
    grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) auto auto;
    grid-template-areas: "plot panel" "plot math" "sub sub";
    gap: 14px clamp(20px, 3vw, 40px);
    padding: calc(var(--bar) + 20px) clamp(16px, 4vw, 56px) calc(var(--bar) + 10px);
  }
  #film { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .slot, .math, .sub { position: relative; z-index: 1; min-height: 0; }
  .plot { grid-area: plot; }
  .panel { grid-area: panel; }

  .math { grid-area: math; height: 9.4em; font-size: 16px; transition: none; }
  .math .lbl, .kicker, .chapter .act {
    font: 600 10.5px/1.2 var(--sans);
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--dim);
    margin: 0 0 .5em;
  }
  .eq { font-family: var(--serif); font-weight: 500; font-size: 1.55em; line-height: 1.3; white-space: nowrap; font-variant-numeric: lining-nums; }
  .nt { text-transform: none; letter-spacing: 0; }
  .eq.sm { font-size: 1.28em; white-space: normal; }
  .eq i { font-style: italic; }
  .eq sub, .eq sup { font-size: .6em; font-style: italic; }
  .a { color: var(--amber); } .r { color: var(--rose); } .g { color: var(--lilac); } .s { color: var(--star); }
  .num {
    font: 500 .6em/1 var(--mono);
    font-style: normal;
    font-variant-numeric: tabular-nums;
    padding: .18em .4em;
    border-radius: 4px;
    background: rgba(238, 230, 214, .08);
    vertical-align: .18em;
  }
  .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .66em; line-height: 1.08; margin: 0 .1em; }
  .fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .2em; }
  .note { color: var(--dim); font-size: .9em; max-width: 46ch; margin: .45em 0 0; }

  .sub {
    grid-area: sub;
    justify-self: center;
    text-align: center;
    max-width: 54ch;
    min-height: 2.9em;
    font-size: clamp(15px, 1.5vw, 19px);
    line-height: 1.45;
    text-wrap: balance;
    text-shadow: 0 1px 14px #000, 0 0 2px #000;
  }

  .titlecard {
    position: absolute; inset: 0; z-index: 2;
    display: grid; place-content: center; gap: 14px;
    text-align: center; pointer-events: none; padding-inline: 16px;
  }
  .titlecard h1 {
    margin: 0;
    font: italic 500 clamp(44px, 7.4vw, 104px)/1 var(--serif);
    letter-spacing: -.01em;
    text-wrap: balance;
    text-shadow: 0 0 48px rgba(244, 184, 96, .35);
  }
  .titlecard .by { font: italic 500 clamp(17px, 1.8vw, 22px)/1.3 var(--serif); color: var(--dim); }

  .chapter {
    position: absolute; z-index: 2; pointer-events: none;
    left: clamp(16px, 4vw, 56px); top: calc(var(--bar) + 14px);
  }
  .chapter .act { color: var(--amber); }
  .chapter .name { font: italic 500 clamp(28px, 3.2vw, 42px)/1.05 var(--serif); text-shadow: 0 2px 20px #000; }

  .endcard {
    position: absolute; inset: 0; z-index: 3;
    display: grid; place-content: center; justify-items: center; gap: 16px;
    padding-inline: 16px; pointer-events: none;
  }
  .endcard > * { pointer-events: auto; }
  .endcard .fin { font: italic 500 clamp(34px, 4.6vw, 60px)/1 var(--serif); text-shadow: 0 0 40px rgba(244, 184, 96, .4); }

  button {
    font: 500 13px/1 var(--sans);
    color: var(--bone);
    background: transparent;
    border: 1px solid var(--hair);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { border-color: rgba(238, 230, 214, .4); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  button.on, button[aria-pressed="true"] { color: var(--amber); border-color: rgba(244, 184, 96, .55); }
  .endcard button { font-size: 14px; padding: 10px 20px; }

  .controls { display: flex; align-items: center; gap: 12px; padding: 10px 16px 6px; }
  .scrubwrap { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; }
  #scrub { width: 100%; accent-color: var(--amber); margin: 0; }
  .ticks { position: absolute; inset: 0; pointer-events: none; }
  .ticks span { position: absolute; top: 50%; width: 1px; height: 12px; margin-top: -6px; background: rgba(238, 230, 214, .35); }
  .home { font: 500 13px/1 var(--sans); color: var(--dim); white-space: nowrap; }
  .home:hover { color: var(--amber); }
  .time { font: 12px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--dim); }
  .chapters { display: flex; gap: 6px; overflow-x: auto; padding: 4px 16px 12px; scrollbar-width: none; }
  .chapters button { font-size: 12px; padding: 6px 11px; color: var(--dim); }
  .chapters button.on { color: var(--amber); }

  @media (max-aspect-ratio: 1/1), (max-width: 760px) {
    .stage {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1.25fr) minmax(0, 1fr) auto auto;
      grid-template-areas: "plot" "panel" "math" "sub";
      gap: 10px;
    }
    .math { font-size: 13px; height: 8.8em; }
    .sub { font-size: 14.5px; }
    .time, .home { display: none; }
    .controls { flex-wrap: wrap; row-gap: 8px; }
    .scrubwrap { order: -1; flex-basis: 100%; }
  }
</style>
</head>
<body>

<div class="theatre">
  <div class="stage" id="stage">
    <canvas id="film" aria-label="Animated film about evaluating models: train/test splits, cross-validation, precision, recall, ROC curves and overfitting"></canvas>
    <div class="slot plot" id="slotPlot"></div>
    <div class="slot panel" id="slotPanel"></div>
    <div class="math" id="math" aria-live="off"></div>
    <div class="sub" id="sub"></div>

    <div class="titlecard" id="titlecard">
      <div class="kicker">A short film about evaluating machine learning models</div>
      <h1>Honest Scores</h1>
      <div class="by">how to tell a model that learned from one that memorised</div>
    </div>
    <div class="chapter" id="chapter"><div class="act" id="chapAct"></div><div class="name" id="chapName"></div></div>
    <div class="endcard" id="endcard" hidden>
      <div class="fin">fin.</div>
      <button id="replay" type="button">Watch again</button>
    </div>
  </div>

  <div class="controls">
    <button id="play" type="button">Pause</button>
    <div class="scrubwrap">
      <input id="scrub" type="range" min="0" max="130" step="0.01" value="0" aria-label="Film position">
      <div class="ticks" id="ticks"></div>
    </div>
    <span class="time" id="time">0:00 / 2:10</span>
    <button id="sound" type="button" aria-pressed="false">Sound off</button>
    <button id="narrate" type="button" aria-pressed="false">Narration off</button>
    <a class="home" href="../" target="_top">All lessons</a>
  </div>
  <nav class="chapters" id="chapters" aria-label="Chapters"></nav>
</div>

<script src="film-kit.js?v=1"></script>
<script>
(() => {
  const { TAU, clamp, lerp, ease, E, win, fmt, COL, rgba, hexRGB, mixHex, mulberry32, gaussFrom } = FilmKit.util;
  window.__evalStats = () => ({ K1_TRAIN, K1_TEST, CV, C5, AUC, ERR, BEST });
  const POS = COL.rose, NEG = COL.star, colOf = c => c ? POS : NEG;
  const rnd = mulberry32(8080), gauss = gaussFrom(rnd);
  // a curved border with some noisy labels, so a very smooth model underfits and a very jumpy one overfits
  const make = n => Array.from({ length: n }, () => { const x = -3.6 + rnd() * 7.2, y = -2.5 + rnd() * 5; let c = y > 1.3 * Math.sin(1.1 * x) ? 1 : 0; if (rnd() < .12) c = 1 - c; return { x, y, c }; });
  const TR = make(150), TE = make(150);
  const d2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
  const score = (pts, q, k) => { const nb = pts.map(p => [d2(p, q), p.c]).sort((a, b) => a[0] - b[0]).slice(0, k); return nb.reduce((s, n) => s + n[1], 0) / k; };
  const acc = (pts, k, on) => on.filter(p => (score(pts, p, k) >= .5 ? 1 : 0) === p.c).length / on.length;
  const K1_TRAIN = acc(TR, 1, TR), K1_TEST = acc(TR, 1, TE);
  // five folds of the training points
  const FOLDS = [0, 1, 2, 3, 4].map(f => TR.filter((_, i) => i % 5 === f));
  const FOLD_ACC = FOLDS.map((fold, f) => { const rest = TR.filter((_, i) => i % 5 !== f); return fold.filter(p => (score(rest, p, 15) >= .5 ? 1 : 0) === p.c).length / fold.length; });
  const CV = FOLD_ACC.reduce((s, v) => s + v, 0) / 5;
  // the k = 15 model on the test points
  const SC = TE.map(p => score(TR, p, 15));
  const conf = t => { let tp = 0, fp = 0, fn = 0, tn = 0; TE.forEach((p, i) => { const pr = SC[i] >= t ? 1 : 0; if (pr && p.c) tp++; else if (pr) fp++; else if (p.c) fn++; else tn++; }); return { tp, fp, fn, tn }; };
  const C5 = conf(.5);
  const NPOS = TE.filter(p => p.c).length, NNEG = TE.length - NPOS;
  const THRS = [...new Set(SC)].sort((a, b) => b - a);
  const ROC = [[0, 0]].concat(THRS.map(t => { const c = conf(t); return [c.fp / NNEG, c.tp / NPOS]; }));
  const AUC = ROC.slice(1).reduce((s, [x2, y2], i) => s + (x2 - ROC[i][0]) * (y2 + ROC[i][1]) / 2, 0);
  // complexity sweep: k from 61 (simple) to 1 (flexible)
  const KS = [61, 45, 31, 21, 15, 11, 9, 7, 5, 3, 1];
  const ERR = KS.map(k => ({ k, train: 1 - acc(TR, k, TR), test: 1 - acc(TR, k, TE) }));
  const BEST = ERR.reduce((a, b) => b.test < a.test ? b : a);
  // a rare illness: 100 people, 5 sick
  const SICK = new Set([13, 37, 58, 71, 92]), CAUGHT = new Set([13, 37, 58, 92]), ALARMS = new Set([4, 22, 45, 50, 66, 77, 81, 88]);

  const DUR = 130;
  const CHAPTERS = [
    { t: 0, act: '', name: 'Opening' },
    { t: 8, act: 'Act I', name: 'Too Good to Be True' },
    { t: 22, act: 'Act II', name: 'Hold Some Back' },
    { t: 40, act: 'Act III', name: 'Four Kinds of Answer' },
    { t: 58, act: 'Act IV', name: 'When Accuracy Lies' },
    { t: 74, act: 'Act V', name: 'Moving the Threshold' },
    { t: 96, act: 'Act VI', name: 'Too Simple, Too Complex' },
    { t: 117, act: 'Epilogue', name: 'Honest Scores' },
  ];
  const SUBS = [
    [0.6, 7.4, 'A model is only as good as the score we give it. So how do we score it honestly?'],
    [8.6, 14.6, 'This model asks only its single nearest neighbour. On the points it learned from, it is never wrong.'],
    [15.0, 21.4, `But on new points it has never seen, it gets ${Math.round((1 - K1_TEST) * 100)} percent of them wrong. It memorised, rather than learned.`],
    [22.6, 29.6, 'So hold some data back. Train on most of it, and test only on points the model never saw.'],
    [30.0, 39.4, 'Better still, cut the data into five folds. Each fold takes a turn as the test, and the scores are averaged.'],
    [40.6, 47.6, 'Every prediction lands in one of four boxes: right or wrong, about yes or about no.'],
    [48.0, 57.4, 'Precision asks: when it says yes, how often is it right? Recall asks: of the real yeses, how many did it find?'],
    [58.6, 65.4, 'One hundred people, five of them sick. A lazy model says everyone is healthy.'],
    [65.8, 73.4, 'It is ninety five percent accurate, and it found nobody. Accuracy alone can lie.'],
    [74.6, 81.6, 'The model gives each point a score. Where we draw the line between yes and no is our choice.'],
    [82.0, 88.4, 'A high line is cautious: few false alarms, but many missed. A low line catches more, and cries wolf more often.'],
    [88.8, 95.4, 'Sweep the line, and trace every trade-off at once. That is the ROC curve. The area under it sums it up.'],
    [96.6, 103.4, 'Now make the model more and more flexible, by asking fewer neighbours.'],
    [103.8, 110.4, 'Training error keeps falling. Test error falls, then rises again. Too simple underfits. Too complex overfits.'],
    [110.8, 116.4, 'The best model lives at the bottom of the test curve, and only held-out data can find it.'],
    [117.6, 122.4, 'A good score is not the highest one you can get.'],
    [122.8, 129.4, 'It is the one that stays true on data the model has never seen.'],
  ];

  function plane(g) {
    const R = g.RM, s = Math.min(R.w / 8, R.h / 6), cx = R.x + R.w / 2, cy = R.y + R.h / 2;
    return { R, s, X: x => cx + x * s, Y: y => cy - y * s, inv: (px, py) => ({ x: (px - cx) / s, y: (cy - py) / s }) };
  }
  const fieldCache = new Map();
  function field(g, G, k) {
    const key = k + '|' + Math.round(G.R.w) + 'x' + Math.round(G.R.h);
    if (fieldCache.has(key)) return fieldCache.get(key);
    const fw = Math.max(8, Math.round(G.R.w / 6)), fh = Math.max(6, Math.round(G.R.h / 6));
    const c = document.createElement('canvas'); c.width = fw; c.height = fh;
    const cx = c.getContext('2d'), id = cx.createImageData(fw, fh), d = id.data, ca = hexRGB(POS), cb = hexRGB(NEG);
    for (let j = 0; j < fh; j++) for (let i = 0; i < fw; i++) {
      const q = G.inv(G.R.x + (i + .5) / fw * G.R.w, G.R.y + (j + .5) / fh * G.R.h), s = score(TR, q, k), col = s >= .5 ? ca : cb, o = (j * fw + i) * 4;
      d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = Math.round(255 * (.08 + .22 * Math.abs(2 * s - 1)));
    }
    cx.putImageData(id, 0, 0); fieldCache.set(key, c); return c;
  }
  const kAt = t => KS[Math.min(KS.length - 1, Math.floor(E(t, 97, 109) * KS.length))];
  const thrAt = t => lerp(1.02, -.02, E(t, 76, 94));

  function draw(t, g) {
    const { ctx } = g, R = g.RM, G = plane(g);
    ctx.save(); g.rrect(R.x, R.y, R.w, R.h, 10); ctx.clip();
    // Acts I–III: the scatter
    const scA = E(t, 8.6, 10.5) * (1 - E(t, 57.6, 59));
    if (scA > 0) {
      if (t < 22.4) { ctx.globalAlpha = scA * E(t, 9, 11); ctx.drawImage(field(g, G, 1), R.x, R.y, R.w, R.h); }
      const showTest = t > 14.6 && t < 22.4 ? E(t, 14.6, 16) : t >= 22.4 && t < 30 ? 1 : 0;
      ctx.globalAlpha = 1;
      const foldOn = t >= 30 && t < 40.2 ? Math.min(4, Math.floor((t - 30.4) / 1.9)) : -1;
      TR.forEach((p, i) => {
        let a = scA, hollow = false;
        if (foldOn >= 0) { hollow = i % 5 === foldOn; a *= hollow ? 1 : .5; }
        ctx.globalAlpha = a;
        if (hollow) { ctx.strokeStyle = colOf(p.c); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(G.X(p.x), G.Y(p.y), 5, 0, TAU); ctx.stroke(); }
        else g.glowDot(G.X(p.x), G.Y(p.y), 3.4, colOf(p.c), 8);
      });
      if (showTest > 0) {
        TE.forEach((p, i) => {
          const wrong = (score(TR, p, 1) >= .5 ? 1 : 0) !== p.c;
          ctx.globalAlpha = scA * showTest; ctx.strokeStyle = colOf(p.c); ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(G.X(p.x), G.Y(p.y), 5, 0, TAU); ctx.stroke();
          if (wrong && t < 22.4) { ctx.strokeStyle = COL.amber; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(G.X(p.x), G.Y(p.y), 10, 0, TAU); ctx.stroke(); }
        });
      }
      ctx.globalAlpha = scA;
      if (t < 30) g.txt(t < 22.4 ? 'filled: training · rings: new points · amber: wrong' : 'filled: train (70%) · rings: test (30%)', R.x + 14, R.y + R.h - 14, { s: 12, c: COL.bone });
      else if (t < 40.2) g.txt(`fold ${foldOn + 1} of 5 is the test (rings)`, R.x + 14, R.y + R.h - 14, { s: 12, c: COL.bone });
      else g.txt('each new point flies to its box', R.x + 14, R.y + R.h - 14, { s: 12, c: COL.bone, a: win(t, 40.2, 48, .5) });
    }
    // Act IV: one hundred people
    const pA = win(t, 58.4, 74.2, .8);
    if (pA > 0) {
      const cell = Math.min(R.w / 12, R.h / 11), ox = R.x + (R.w - cell * 10) / 2, oy = R.y + (R.h - cell * 10) / 2 + 8;
      const smart = E(t, 69, 70.5);
      for (let i = 0; i < 100; i++) {
        const x = ox + (i % 10 + .5) * cell, y = oy + (Math.floor(i / 10) + .5) * cell, sick = SICK.has(i);
        ctx.globalAlpha = pA * E(t, 58.6 + i * .012, 59.4 + i * .012);
        g.glowDot(x, y, cell * .22, sick ? POS : NEG, 8);
        const flagged = smart > .5 && (CAUGHT.has(i) || ALARMS.has(i));
        if (flagged) { ctx.strokeStyle = COL.amber; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, cell * .38, 0, TAU); ctx.stroke(); }
        if (sick && t > 66 && t < 69 && !flagged) { ctx.strokeStyle = COL.rose; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.arc(x, y, cell * .4, 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
      }
      ctx.globalAlpha = pA;
      g.txt(smart > .5 ? 'a real model: amber rings are its "sick" calls' : 'the lazy model: "everyone is healthy"', R.x + R.w / 2, oy - 12, { s: 14, c: COL.amber, al: 'center', w: 600 });
    }
    // Act V: scores on a line, and a threshold
    const tA = win(t, 74.4, 96.2, .8);
    if (tA > 0) {
      const S = g.scaler(R, [-.05, 1.05], [0, 1], { l: 20, r: 20, t: 40, b: 40 }), thr = thrAt(t);
      ctx.globalAlpha = tA;
      g.line(S.ix, S.iy + S.ih, S.ix + S.iw, S.iy + S.ih, rgba(COL.bone, .3));
      [0, .25, .5, .75, 1].forEach(v => g.txt(v.toFixed(2), S.X(v), S.iy + S.ih + 16, { mono: true, s: 10.5, al: 'center' }));
      g.txt('score from the model →', S.ix + S.iw, S.iy + S.ih + 32, { s: 11, al: 'right' });
      ctx.fillStyle = rgba(COL.amber, .07); ctx.fillRect(S.X(clamp(thr, -.05, 1.05)), S.iy, S.ix + S.iw - S.X(clamp(thr, -.05, 1.05)), S.ih);
      const jit = mulberry32(5);
      TE.forEach((p, i) => { const y = S.iy + 20 + jit() * (S.ih - 40) * .9 + (p.c ? 0 : 0); ctx.globalAlpha = tA; g.glowDot(S.X(SC[i] + (jit() - .5) * .02), p.c ? y * .5 + (S.iy) * .5 : y * .5 + (S.iy + S.ih) * .5, 4, colOf(p.c), 8); });
      ctx.globalAlpha = tA;
      if (thr >= -.04 && thr <= 1.04) { ctx.strokeStyle = COL.amber; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(S.X(thr), S.iy - 8); ctx.lineTo(S.X(thr), S.iy + S.ih); ctx.stroke(); }
      g.txt(`threshold ${fmt(clamp(thr, 0, 1), 2)} · right of the line means "yes"`, S.ix, S.iy - 14, { mono: true, s: 12.5, c: COL.amber });
      g.cap('SICK', S.ix + 4, S.iy + 14, { c: POS }); g.cap('HEALTHY', S.ix + 4, S.iy + S.ih - 8, { c: NEG });
    }
    // Act VI: flexibility
    const kA = win(t, 96.4, 117.2, .8);
    if (kA > 0) {
      const k = kAt(t);
      ctx.globalAlpha = kA; ctx.drawImage(field(g, G, k), R.x, R.y, R.w, R.h);
      TR.forEach(p => g.glowDot(G.X(p.x), G.Y(p.y), 3, colOf(p.c), 6));
      g.txt(`k = ${k}`, R.x + R.w - 14, R.y + 28, { mono: true, s: 17, c: COL.amber, al: 'right', w: 600 });
      g.txt(k >= 31 ? 'too simple' : k <= 3 ? 'too flexible' : 'about right', R.x + R.w - 14, R.y + 50, { serif: true, it: true, s: 17, c: COL.bone, al: 'right', w: 600 });
    }
    ctx.restore();
    const ep = E(t, 118, 120);
    if (ep > 0) g.txt('test on what it has never seen', R.x + R.w / 2, R.y + R.h / 2, { serif: true, it: true, s: 34, c: COL.amber, al: 'center', w: 600, a: ep });
    drawPanel(t, g);
  }

  function grid2(g, R, c, a, fly, t) {
    const { ctx } = g, w = (R.w - 60) / 2, h = Math.min(90, (R.h - 120) / 2), x0 = R.x + 50, y0 = R.y + 50;
    ctx.save(); ctx.globalAlpha = a;
    g.txt('truly yes', x0 + w / 2, y0 - 8, { s: 11, al: 'center', c: POS }); g.txt('truly no', x0 + w * 1.5, y0 - 8, { s: 11, al: 'center', c: NEG });
    g.txt('said yes', x0 - 8, y0 + h / 2 + 4, { s: 11, al: 'right', c: COL.bone }); g.txt('said no', x0 - 8, y0 + h * 1.5 + 4, { s: 11, al: 'right', c: COL.bone });
    const cells = [['TP', c.tp, 0, 0, COL.mint], ['FP', c.fp, 1, 0, COL.rose], ['FN', c.fn, 0, 1, COL.rose], ['TN', c.tn, 1, 1, COL.mint]];
    cells.forEach(([name, n, cx, cy, col]) => {
      const x = x0 + cx * w, y = y0 + cy * h;
      ctx.fillStyle = rgba(col, .08 + .1 * Math.min(1, n / 30)); ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
      ctx.strokeStyle = rgba(col, .5); ctx.strokeRect(x + 2, y + 2, w - 4, h - 4);
      g.txt(name, x + 10, y + 18, { s: 11, c: col, w: 700 });
      g.txt(String(Math.round(n * fly)), x + w / 2, y + h / 2 + 12, { mono: true, s: 26, c: COL.bone, al: 'center', w: 600 });
    });
    ctx.restore();
    return { x0, y0, w, h };
  }

  function drawPanel(t, g) {
    const R = g.RP, { ctx } = g;
    const a1 = win(t, 10, 22.4, .8);
    if (a1 > 0) {
      ctx.save(); ctx.globalAlpha = a1;
      g.cap('ONE NEAREST NEIGHBOUR (k = 1)', R.x + 10, R.y + 12);
      [['on its training points', K1_TRAIN, COL.bone, 10.5], ['on new points', K1_TEST, COL.amber, 15.4]].forEach(([name, v, col, t0], j) => {
        const on = E(t, t0, t0 + 1.2), y = R.y + 48 + j * 54, w = (R.w - 170) * v * on;
        g.txt(name, R.x + 12, y - 6, { s: 12.5, c: col, w: 600 });
        ctx.fillStyle = rgba(col, .7); ctx.fillRect(R.x + 12, y, w, 20);
        g.txt(Math.round(v * 100 * on) + '%', R.x + 20 + w, y + 15, { mono: true, s: 13, c: COL.bone });
      });
      ctx.restore();
    }
    const a2 = win(t, 30.2, 40.4, .8);
    if (a2 > 0) {
      ctx.save(); ctx.globalAlpha = a2;
      g.cap('FIVE FOLDS, k = 15', R.x + 10, R.y + 12);
      FOLD_ACC.forEach((v, f) => {
        const on = E(t, 30.6 + f * 1.9, 31.6 + f * 1.9), y = R.y + 36 + f * 30, w = (R.w - 170) * v * on;
        g.txt(`fold ${f + 1}`, R.x + 12, y + 14, { mono: true, s: 11.5 });
        ctx.fillStyle = rgba(COL.star, .7); ctx.fillRect(R.x + 70, y, w, 18);
        if (on > .9) g.txt(Math.round(v * 100) + '%', R.x + 76 + w, y + 14, { mono: true, s: 12, c: COL.bone });
      });
      const avg = E(t, 39, 40);
      if (avg > 0) g.txt(`average: ${(CV * 100).toFixed(1)}%`, R.x + 12, R.y + 200, { serif: true, it: true, s: 20, c: COL.amber, w: 600, a: avg });
      ctx.restore();
    }
    const a3 = win(t, 40.4, 58.2, .8);
    if (a3 > 0) {
      const fly = E(t, 41, 46);
      g.cap('THE CONFUSION MATRIX · k = 15, 80 NEW POINTS', R.x + 10, R.y + 12, { a: a3 });
      const gr = grid2(g, R, C5, a3, fly, t);
      const m = E(t, 48, 49.5);
      if (m > 0) {
        const pr = C5.tp / (C5.tp + C5.fp), rc = C5.tp / (C5.tp + C5.fn), ac = (C5.tp + C5.tn) / TE.length;
        ctx.save(); ctx.globalAlpha = a3 * m;
        const y = gr.y0 + gr.h * 2 + 30;
        g.txt(`accuracy ${(ac * 100).toFixed(0)}%   precision ${(pr * 100).toFixed(0)}%   recall ${(rc * 100).toFixed(0)}%`, R.x + 12, y, { mono: true, s: 13, c: COL.bone });
        ctx.restore();
      }
    }
    const a4 = win(t, 58.6, 74.2, .8);
    if (a4 > 0) {
      const smart = E(t, 69, 70.5) > .5;
      const c = smart ? { tp: CAUGHT.size, fp: ALARMS.size, fn: SICK.size - CAUGHT.size, tn: 100 - SICK.size - ALARMS.size } : { tp: 0, fp: 0, fn: 5, tn: 95 };
      g.cap(smart ? 'A REAL MODEL' : 'THE LAZY MODEL', R.x + 10, R.y + 12, { a: a4 });
      const gr = grid2(g, R, c, a4, 1, t);
      const ac = (c.tp + c.tn) / 100, rc = c.tp / 5, pr = c.tp + c.fp ? c.tp / (c.tp + c.fp) : 0;
      ctx.save(); ctx.globalAlpha = a4 * E(t, 65.8, 67);
      g.txt(`accuracy ${Math.round(ac * 100)}%   recall ${Math.round(rc * 100)}%   precision ${Math.round(pr * 100)}%`, R.x + 12, gr.y0 + gr.h * 2 + 30, { mono: true, s: 13, c: smart ? COL.bone : COL.rose });
      ctx.restore();
    }
    const a5 = win(t, 76, 96.4, .8);
    if (a5 > 0) {
      const S = g.scaler(R, [0, 1], [0, 1], { l: 40, r: 16, t: 30, b: 28 }), thr = thrAt(t);
      ctx.save(); ctx.globalAlpha = a5;
      g.cap('ROC CURVE · EVERY THRESHOLD', R.x + 10, R.y + 12);
      g.line(S.ix, S.iy + S.ih, S.ix + S.iw, S.iy + S.ih, rgba(COL.bone, .3)); g.line(S.ix, S.iy, S.ix, S.iy + S.ih, rgba(COL.bone, .3));
      g.dashed(S.X(0), S.Y(0), S.X(1), S.Y(1), rgba(COL.bone, .35));
      g.txt('coin toss', S.X(.62), S.Y(.55), { s: 10.5, c: COL.dim });
      [0, .5, 1].forEach(v => { g.txt(v.toFixed(1), S.X(v), S.iy + S.ih + 14, { mono: true, s: 10, al: 'center' }); g.txt(v.toFixed(1), S.ix - 6, S.Y(v) + 3.5, { mono: true, s: 10, al: 'right' }); });
      g.txt('false alarm rate →', S.ix + S.iw, S.iy + S.ih + 26, { s: 10.5, al: 'right' });
      g.txt('recall ↑', S.ix + 6, S.iy + 10, { s: 10.5 });
      const shown = [[0, 0]].concat(THRS.filter(x => x >= thr).map(x => { const c = conf(x); return [c.fp / NNEG, c.tp / NPOS]; }));
      const auc = E(t, 92, 94);
      if (auc > 0) {
        ctx.fillStyle = rgba(COL.amber, .12 * auc); ctx.beginPath(); ctx.moveTo(S.X(0), S.Y(0));
        ROC.forEach(([x, y]) => ctx.lineTo(S.X(x), S.Y(y))); ctx.lineTo(S.X(1), S.Y(0)); ctx.closePath(); ctx.fill();
        g.txt(`area under curve = ${AUC.toFixed(2)}`, S.X(.55), S.Y(.2), { mono: true, s: 13, c: COL.amber, a: auc, w: 600 });
      }
      ctx.strokeStyle = COL.amber; ctx.lineWidth = 2.2; ctx.beginPath(); shown.forEach(([x, y], i) => i ? ctx.lineTo(S.X(x), S.Y(y)) : ctx.moveTo(S.X(x), S.Y(y))); ctx.stroke();
      const last = shown[shown.length - 1]; g.glowDot(S.X(last[0]), S.Y(last[1]), 5, COL.amber, 14);
      ctx.restore();
    }
    const a6 = win(t, 97, 117.2, .8);
    if (a6 > 0) {
      const S = g.scaler(R, [0, KS.length - 1], [0, .45], { l: 40, r: 16, t: 30, b: 36 }), cur = KS.indexOf(kAt(t));
      ctx.save(); ctx.globalAlpha = a6;
      g.cap('ERROR AS THE MODEL GETS MORE FLEXIBLE', R.x + 10, R.y + 12);
      [0, .2, .4].forEach(v => { g.line(S.ix, S.Y(v), S.ix + S.iw, S.Y(v), rgba(COL.bone, .07)); g.txt(Math.round(v * 100) + '%', S.ix - 6, S.Y(v) + 3.5, { mono: true, s: 10, al: 'right' }); });
      KS.forEach((k, i) => { if (i % 2 === 0 || i === KS.length - 1) g.txt('k=' + k, S.X(i), S.iy + S.ih + 14, { mono: true, s: 9.5, al: 'center' }); });
      g.txt('simple ←', S.ix, S.iy + S.ih + 30, { s: 10.5 }); g.txt('→ flexible', S.ix + S.iw, S.iy + S.ih + 30, { s: 10.5, al: 'right' });
      [['train', COL.bone, 'training error'], ['test', COL.amber, 'test error']].forEach(([key, col, name], j) => {
        ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath();
        ERR.slice(0, cur + 1).forEach((o, i) => i ? ctx.lineTo(S.X(i), S.Y(o[key])) : ctx.moveTo(S.X(0), S.Y(o[key]))); ctx.stroke();
        g.txt(name, S.ix + S.iw - 4, S.iy + 12 + j * 16, { s: 11, c: col, al: 'right', w: 600 });
      });
      if (t > 110) { const bi = KS.indexOf(BEST.k); g.glowDot(S.X(bi), S.Y(BEST.test), 6, COL.amber, 16); g.txt(`best: k = ${BEST.k}`, S.X(bi), S.Y(BEST.test) + 20, { mono: true, s: 11.5, c: COL.amber, al: 'center' }); }
      ctx.restore();
    }
  }

  const num = s => `<span class="num">${s}</span>`;
  const frac = (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
  const MATH = [
    { t0: 8.4, t1: 22, html: () => `<p class="lbl">Training score vs test score</p>
       <div class="eq sm">training points ${num(Math.round(K1_TRAIN * 100) + '%')} &nbsp; new points ${num(Math.round(K1_TEST * 100) + '%')}</div>
       <p class="note">A score measured on the training data says how well the model memorised, not how well it will do.</p>` },
    { t0: 22.4, t1: 40, html: t => t < 30 ? `<p class="lbl">Train / test split</p>
       <div class="eq sm">70% to learn from, 30% held back to test</div>
       <p class="note">The test points must never be used for training or for tuning.</p>` : `<p class="lbl">5-fold cross-validation</p>
       <div class="eq sm">CV score = ${frac('score<sub>1</sub> + … + score<sub>5</sub>', '5')} = ${num((CV * 100).toFixed(1) + '%')}</div>
       <p class="note">Every point is tested exactly once, and the average is steadier than one split.</p>` },
    { t0: 40.4, t1: 58, html: () => `<p class="lbl">Precision and recall</p>
       <div class="eq sm">precision = ${frac('TP', 'TP + FP')} = ${frac(C5.tp, C5.tp + C5.fp)} &nbsp; recall = ${frac('TP', 'TP + FN')} = ${frac(C5.tp, C5.tp + C5.fn)}</div>
       <div class="eq sm">accuracy = ${frac('TP + TN', 'all')} = ${num(((C5.tp + C5.tn) / TE.length * 100).toFixed(0) + '%')}</div>` },
    { t0: 58.4, t1: 74, html: t => `<p class="lbl">Unbalanced classes</p>
       <div class="eq sm">lazy model: accuracy ${num('95%')} &nbsp; recall ${num('0%')}</div>
       ${t > 69 ? `<div class="eq sm">real model: accuracy ${num(Math.round((CAUGHT.size + 100 - SICK.size - ALARMS.size)) + '%')} &nbsp; recall ${num(Math.round(CAUGHT.size / SICK.size * 100) + '%')} &nbsp; precision ${num(Math.round(CAUGHT.size / (CAUGHT.size + ALARMS.size) * 100) + '%')}</div>` : ''}
       <p class="note">When one class is rare, look at recall and precision, not accuracy.</p>` },
    { t0: 74.4, t1: 96, html: t => { const c = conf(clamp(thrAt(t), 0, 1)); return `<p class="lbl">Threshold <span class="nt">${fmt(clamp(thrAt(t), 0, 1), 2)}</span></p>
       <div class="eq sm">recall (true positive rate) = ${frac('TP', 'TP + FN')} = ${num((c.tp / NPOS).toFixed(2))}</div>
       <div class="eq sm">false positive rate = ${frac('FP', 'FP + TN')} = ${num((c.fp / NNEG).toFixed(2))}</div>`; } },
    { t0: 96.4, t1: 117, html: () => `<p class="lbl">Bias and variance</p>
       <div class="eq sm">too simple: high error everywhere (bias)</div>
       <div class="eq sm">too flexible: low training error, high test error (variance)</div>` },
    { t0: 117.4, t1: 130.5, html: () => `<p class="lbl">The rule</p>
       <div class="eq sm">tune with cross-validation · report on a test set used once</div>` },
  ];
  const mood = t => t < 15 ? .3 : t < 22 ? .6 : t < 40 ? .3 : t < 58 ? .25 : t < 69 ? .75 : t < 74 ? .2 : t < 96 ? .35 : t < 110 ? .5 : .1;
  const events = [{ t: 15.4, fn: pl => pl(233.08, .07) }, ...[0, 1, 2, 3, 4].map(f => ({ t: 30.6 + f * 1.9, fn: (pl, note) => pl(note(.3 + f * .1), .05) })),
    { t: 39, fn: pl => pl(783.99, .07) }, { t: 65.8, fn: pl => pl(207.65, .08) }, { t: 69.2, fn: pl => pl(659.25, .07) }, { t: 92, fn: pl => pl(880, .07) }, { t: 110.4, fn: pl => pl(783.99, .07) }];
  FilmKit.run({ DUR, CHAPTERS, SUBS, MATH, draw, mood, events, chord: [92.5, 138.59, 185, 233.08, 277.18] });
})();

</script>
</body>
